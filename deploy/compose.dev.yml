# Development override, e.g. on a Mac (Docker Desktop, arm64): run ONLY the router, built from this repo, without the OAuth front or Redis.
#   docker compose -f deploy/compose.yml -f deploy/compose.dev.yml up router
# The router answers on http://127.0.0.1:PORT/mcp with NO authentication (AUTH=none is accepted only when bound to loopback).
# Use the MCP Inspector or `claude mcp add --transport http jobwatch-dev http://127.0.0.1:18931/mcp`; never expose this port.
services:
  router:
    build:
      context: ..
      dockerfile: Dockerfile
    image: notcheu/jobwatch-mcp:dev
    labels: []                               # not managed by Watchtower
    user: "0:0"                              # Docker Desktop's socket is not owned by uid 1000
    environment:
      AUTH: none
      PORT: ${PORT:?set PORT in .env}
      BASE_URL: http://127.0.0.1:${PORT:?set PORT in .env}
      DASHBOARD_PORT: ${DASHBOARD_PORT:?set DASHBOARD_PORT in .env}
      DASHBOARD_URL: http://127.0.0.1:${DASHBOARD_PORT:?set DASHBOARD_PORT in .env}/dashboard/
      BROWSER_IMAGE: jobwatch-browser:dev  # built locally for the host architecture (arm64 uses Chromium, see 05)
    ports:
      - "127.0.0.1:${PORT:?set PORT in .env}:${PORT:?set PORT in .env}"   # the MCP endpoint, no authentication
