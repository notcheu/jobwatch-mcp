# Self-contained: copy this file next to a `.env` file (copy deploy/.env.example; Compose reads it by itself) and run `docker compose up -d`. Data lands in ./data.
# There are no defaults here: PORT, BASE_URL, BROWSER_NETWORK, DASHBOARD_PORT and METRICS_PORT must be set in `.env`, or Compose stops and says which.
# Every setting lives in `.env` (see .env.example): the front and the router get the whole file as their environment, so this file only
# holds what is tied to its own layout (images, networks, the Docker socket, what is published).
# Always-on services only. Browser containers are spawned by the router (label jobwatch.managed=true).
# Your reverse proxy sends https://mcp.example.com to the single published MCP port below (docs/reverse-proxy.md).
# Runs on Linux and on macOS (Docker Desktop, arm64) for development: see compose.dev.yml and docs/plans/10-deployment.md.
# Add-ons: rootless Docker (compose.rootless.yml, docs/rootless-docker.md) and automatic updates (compose.watchtower.yml, docs/watchtower.md).
name: jobwatch
volumes:
  redis-data:
networks:
  jobwatch-core:     { internal: false }     # front <-> router, front <-> redis (front needs egress to reach Google)
  jobwatch-browsers: { name: "${BROWSER_NETWORK:?set BROWSER_NETWORK in .env}", internal: false }   # router <-> spawned browsers (the router joins them to this network by name: BROWSER_NETWORK); egress is OPEN until the Phase 4 allowlist proxy (09, 14)
services:
  front:                                     # OAuth 2.1 authorization server + reverse proxy (decision D7: babs/mcp-auth-proxy)
    image: ghcr.io/babs/mcp-auth-proxy:1.4.1   # babs/mcp-auth-proxy, pinned to the version this stack was tested with
    env_file: .env   # OIDC_*, TOKEN_SIGNING_SECRET, TRUSTED_PROXY_CIDRS
    environment:                             # tied to this file's layout, so not in .env
      PROXY_BASE_URL: ${BASE_URL:?set BASE_URL in .env}   # the front's public URL: the same BASE_URL as the router's
      LISTEN_ADDR: 0.0.0.0:${PORT:?set PORT in .env}   # where the front listens in its container; PORT is also what gets published below
      METRICS_ADDR: 127.0.0.1:9090          # the front's own metrics and /readyz, inside its container (never published)
      UPSTREAM_MCP_URL: http://router:${PORT:?set PORT in .env}/mcp   # where the front forwards authenticated calls: the router on the private network. The path is both the public mount and forwarded verbatim
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:${PORT:?set PORT in .env}:${PORT:?set PORT in .env}"   # the ONLY published MCP port (the front's LISTEN_ADDR uses the same PORT); the reverse proxy's target. Replace 127.0.0.1 by the host's LAN IP if the proxy is on another machine or in a container
    networks: [ jobwatch-core ]
    mem_limit: 128m
    read_only: true
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    user: "999:999"                          # the image's own redis user: its root entrypoint needs SETUID/SETGID, which cap_drop ALL removes (tested)
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction" ]
    volumes: [ "redis-data:/data" ]          # named volume (a host directory would not be writable by uid 999 under rootless Docker)
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ jobwatch-core ]
    mem_limit: 64m
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    restart: unless-stopped
  router:
    image: notcheu/jobwatch-mcp:latest       # published on every release (docs/releasing.md); pin a version (notcheu/jobwatch-mcp:0.1.0) for a reproducible install, or build your own with `docker build -t notcheu/jobwatch-mcp:latest .`
    env_file: .env   # every router setting: see .env.example and docs/environment-variables.md
    user: "0:0"                              # uid 0 in the container: it owns ./data and can open the Docker socket (under rootless Docker it is the Docker user on the host). Still unprivileged: cap_drop ALL, no-new-privileges, read-only root
    read_only: true
    tmpfs: [ "/tmp:rw,size=64m" ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"   # the Docker socket: edit the left side for another one (rootless: compose.rootless.yml). Docker Desktop (macOS) works as is. Gives the router control of that daemon: use a dedicated user's daemon, see docs/rootless-docker.md
      - "./data:/data"             # owned by uid 0 in the container (hence user "0:0" above)
      # Browser profiles are named Docker volumes (jw-profile-<platform>) created by the router: no host paths, so the same file works on Linux and macOS.
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:?set DASHBOARD_PORT in .env}:${DASHBOARD_PORT:?set DASHBOARD_PORT in .env}"   # the dashboard, for the reverse proxy (/dashboard); nothing listens until it is started
      - "127.0.0.1:${METRICS_PORT:?set METRICS_PORT in .env}:${METRICS_PORT:?set METRICS_PORT in .env}"   # Prometheus scrape target; nothing listens unless metrics are enabled
    networks: [ jobwatch-core, jobwatch-browsers ]   # the MCP port is not published: only the front reaches it
    restart: unless-stopped
