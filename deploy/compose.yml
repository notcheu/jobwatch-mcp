# Self-contained: copy this file next to a `.env` file (Compose reads it by itself) and run `docker compose up -d`. Data lands in ./data.
# Every setting lives in `.env` (see .env.example): the front and the router get the whole file as their environment, so this file only
# holds what is tied to its own layout (images, networks, the Docker socket, what is published).
# Always-on services only. Browser containers are spawned by the router (label jobwatch.managed=true).
# Your reverse proxy sends https://mcp.example.com to the single published MCP port below (docs/reverse-proxy.md).
# Runs on Linux (Ubuntu, rootless Docker) and on macOS (Docker Desktop, arm64) for development: see compose.dev.yml and docs/plans/10-deployment.md.
name: jobwatch
volumes:
  redis-data:
networks:
  jobwatch-core:     { internal: false }     # front <-> router, front <-> redis (front needs egress to reach Google)
  jobwatch-browsers: { internal: false }     # router <-> spawned browsers; egress is OPEN until the Phase 4 allowlist proxy (09, 14)
services:
  front:                                     # OAuth 2.1 authorization server + reverse proxy (decision D7: babs/mcp-auth-proxy)
    image: ${FRONT_IMAGE:-ghcr.io/babs/mcp-auth-proxy:1.4.1}   # pin by digest once verified (S1)
    env_file: [ { path: .env, required: false } ]   # PROXY_BASE_URL, UPSTREAM_MCP_URL, OIDC_*, TOKEN_SIGNING_SECRET, TRUSTED_PROXY_CIDRS, LISTEN_ADDR, METRICS_ADDR
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    ports:
      - "${BIND:-127.0.0.1}:${PORT:-18931}:${PORT:-18931}"   # the ONLY published MCP port (the front's LISTEN_ADDR uses the same PORT); the reverse proxy's target
    networks: [ jobwatch-core ]
    mem_limit: 128m
    read_only: true
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    restart: unless-stopped
  redis:                                     # replay defence for the front (single-use codes, refresh rotation)
    image: redis:7-alpine
    user: "999:999"                          # the image's own redis user: its root entrypoint needs SETUID/SETGID, which cap_drop ALL removes (tested)
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction" ]
    volumes: [ "redis-data:/data" ]          # named volume (a host directory would not be writable by uid 999 under rootless Docker)
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ jobwatch-core ]
    mem_limit: 64m
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    restart: unless-stopped
  router:
    image: jobwatch-router:latest            # pushed by CI (.github/workflows/docker-publish.yml), or built with `docker build -t jobwatch-router:latest .`
    labels:
      - "com.centurylinklabs.watchtower.enable=true"   # only read by Watchtower, if you run it (docs/watchtower.md)
    env_file: [ { path: .env, required: false } ]   # every router setting: see .env.example and docs/environment-variables.md
    user: "0:0"                              # CONFIRMED on the reference host: under rootless Docker uid 0 in the container IS mcpuser on the host. uid 1000 could not write ./data nor would it open the socket. Still unprivileged: cap_drop ALL, no-new-privileges, read-only root
    read_only: true
    tmpfs: [ "/tmp:rw,size=64m" ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    environment:                             # tied to this file's layout, so not in .env
      RUNTIME: docker
      BROWSER_NETWORK: jobwatch_jobwatch-browsers   # compose names networks <project>_<name>; the project is `jobwatch`
      DOCKER_HOST: unix:///var/run/docker.sock          # mcpuser's ROOTLESS socket, mounted below
    volumes:
      - "${DOCKER_SOCKET:-${XDG_RUNTIME_DIR}/docker.sock}:/var/run/docker.sock"   # Linux rootless: $XDG_RUNTIME_DIR/docker.sock; Docker Desktop (macOS): /var/run/docker.sock
      - "./data:/data"             # owned by mcpuser = uid 0 in the container (hence user "0:0" above)
      # Browser profiles are named Docker volumes (jw-profile-<platform>) created by the router: no host paths, so the same file works on Linux and macOS.
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-18933}:${DASHBOARD_PORT:-18933}"   # the dashboard, for the reverse proxy (/dashboard); nothing listens until it is started
      - "${METRICS_BIND:-127.0.0.1}:${METRICS_PORT:-9464}:${METRICS_PORT:-9464}"   # Prometheus scrape target; nothing listens unless metrics are enabled
    networks: [ jobwatch-core, jobwatch-browsers ]   # the MCP port is not published: only the front reaches it
    restart: unless-stopped
