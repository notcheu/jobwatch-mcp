# Copy this file next to a `.env` file (copy .env.example) and run `docker compose up -d`.
# Data lands in ./data.
# PORT, BASE_URL, BROWSER_NETWORK, DASHBOARD_PORT and METRICS_PORT must be set in `.env`.
# Add-ons: compose.rootless.yml (rootless Docker), compose.watchtower.yml (automatic updates).

name: jobwatch
volumes:
  redis-data:
networks:
  # front <-> router and front <-> redis. Internet access is on: the front calls Google to sign you in.
  jobwatch-core:     { internal: false }
    # router <-> the browsers it spawns. Internet access is on and unrestricted: the browsers load the job sites.
  jobwatch-browsers: { name: "${BROWSER_NETWORK:?set BROWSER_NETWORK in .env}", internal: false }

services:
  # OAuth 2.1 authorization server + reverse proxy
  front:
    image: ghcr.io/babs/mcp-auth-proxy:1.4.1
    env_file: .env
    environment:
      PROXY_BASE_URL: ${BASE_URL:?set BASE_URL in .env}
      LISTEN_ADDR: 0.0.0.0:${PORT:?set PORT in .env}
      METRICS_ADDR: 127.0.0.1:9090
      # The front serves and forwards this same path (/mcp)
      UPSTREAM_MCP_URL: http://router:${PORT:?set PORT in .env}/mcp
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    # The only published MCP port, the reverse proxy's target: the router's own MCP port is not published, only the front reaches it.
    # Use the host's LAN IP instead of 127.0.0.1 if the proxy is on another machine or in a container.
    ports:
      - "127.0.0.1:${PORT:?set PORT in .env}:${PORT:?set PORT in .env}"
    networks: [ jobwatch-core ]
    mem_limit: 128m
    read_only: true
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Start as redis user directly: the image's root entrypoint needs capabilities (chown, setuid) that cap_drop ALL removes.
    user: "999:999"
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction" ]
    # Use a named volume: a host directory would not be writable by uid 999
    volumes: [ "redis-data:/data" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ jobwatch-core ]
    mem_limit: 64m
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    restart: unless-stopped

  router:
    image: notcheu/jobwatch-mcp:latest
    env_file: .env
    # The image runs as uid 1000, which cannot open the Docker socket nor write ./data.
    # Under rootless Docker uid 0 is the Docker user on the host.
    # Still unprivileged: cap_drop ALL, no-new-privileges, read-only root
    user: "0:0"
    read_only: true
    tmpfs: [ "/tmp:rw,size=64m" ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./data:/data"
    ports:
      # reverse proxy target for /dashboard; closed until the dashboard is started
      - "127.0.0.1:${DASHBOARD_PORT:?set DASHBOARD_PORT in .env}:${DASHBOARD_PORT:?set DASHBOARD_PORT in .env}"
      # Prometheus scrape target; closed unless metrics are enabled
      - "127.0.0.1:${METRICS_PORT:?set METRICS_PORT in .env}:${METRICS_PORT:?set METRICS_PORT in .env}"
    networks: [ jobwatch-core, jobwatch-browsers ]
    restart: unless-stopped
