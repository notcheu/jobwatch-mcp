# Copy this file next to a `.env` file (copy .env.example) and run `docker compose up -d`. Data lands in ./data.
# PORT, BASE_URL, BROWSER_NETWORK, DASHBOARD_PORT and METRICS_PORT must be set in `.env`, or Compose stops and says which.
# Settings live in `.env`; this file only holds what is tied to its own layout (images, networks, the Docker socket, what is published).
# Add-ons: compose.rootless.yml (rootless Docker), compose.watchtower.yml (automatic updates).
name: jobwatch
volumes:
  redis-data:
networks:
  jobwatch-core:     { internal: false }     # front <-> router, front <-> redis (the front needs egress to reach Google)
  jobwatch-browsers: { name: "${BROWSER_NETWORK:?set BROWSER_NETWORK in .env}", internal: false }   # router <-> spawned browsers; egress is open
services:
  front:                                     # OAuth 2.1 authorization server + reverse proxy
    image: ghcr.io/babs/mcp-auth-proxy:1.4.1
    env_file: .env   # OIDC_*, TOKEN_SIGNING_SECRET, TRUSTED_PROXY_CIDRS
    environment:
      PROXY_BASE_URL: ${BASE_URL:?set BASE_URL in .env}
      LISTEN_ADDR: 0.0.0.0:${PORT:?set PORT in .env}
      METRICS_ADDR: 127.0.0.1:9090          # inside the container only, never published
      UPSTREAM_MCP_URL: http://router:${PORT:?set PORT in .env}/mcp   # the path is both the public mount and forwarded verbatim
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:${PORT:?set PORT in .env}:${PORT:?set PORT in .env}"   # the only published MCP port, the reverse proxy's target. Use the host's LAN IP instead of 127.0.0.1 if the proxy is on another machine or in a container
    networks: [ jobwatch-core ]
    mem_limit: 128m
    read_only: true
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    user: "999:999"                          # its root entrypoint needs SETUID/SETGID, which cap_drop ALL removes
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction" ]
    volumes: [ "redis-data:/data" ]          # named volume: a host directory would not be writable by uid 999 under rootless Docker
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ jobwatch-core ]
    mem_limit: 64m
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    restart: unless-stopped
  router:
    image: notcheu/jobwatch-mcp:latest       # pin a version (notcheu/jobwatch-mcp:0.1.0) for a reproducible install, or build your own with `docker build -t notcheu/jobwatch-mcp:latest .`
    env_file: .env
    user: "0:0"                              # owns ./data and can open the Docker socket (under rootless Docker it is the Docker user on the host). Still unprivileged: cap_drop ALL, no-new-privileges, read-only root
    read_only: true
    tmpfs: [ "/tmp:rw,size=64m" ]
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"   # gives the router control of that daemon, so use a dedicated user's (compose.rootless.yml). Edit the left side for another socket
      - "./data:/data"
      # Browser profiles are named Docker volumes created by the router: no host paths.
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:?set DASHBOARD_PORT in .env}:${DASHBOARD_PORT:?set DASHBOARD_PORT in .env}"   # the dashboard, for the reverse proxy; nothing listens until it is started
      - "127.0.0.1:${METRICS_PORT:?set METRICS_PORT in .env}:${METRICS_PORT:?set METRICS_PORT in .env}"   # Prometheus scrape target; nothing listens unless metrics are enabled
    networks: [ jobwatch-core, jobwatch-browsers ]   # the MCP port is not published: only the front reaches it
    restart: unless-stopped
