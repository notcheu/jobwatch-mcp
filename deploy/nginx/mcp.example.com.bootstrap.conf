# STEP 1 (before the certificate exists): answers Let's Encrypt's HTTP-01 challenge and nothing else.
# Install as /etc/nginx/sites-available/mcp.example.com, enable it, reload, run certbot, then replace it with mcp.example.com.conf.
server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 404;
    }
}
