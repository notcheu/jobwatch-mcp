# STEP 2 (after certbot created the certificate): the real site for the Claude MCP connector.
# Upstream = the single published port of the OAuth front (JW_BIND:JW_HOST_PORT in deploy/.env).
# If Nginx runs in a container, replace 127.0.0.1 with the Docker host address reachable from it.

# Redirect all plain HTTP, except the ACME challenge used by certbot renewals.
# http context (a file in conf.d, or above the first server block of this file when it is included in http{}):
limit_req_zone $binary_remote_addr zone=jw_dashboard:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;                  # MCP requests are small JSON

    # The operator dashboard (docs/plans/17-dashboard.md). Nothing listens behind this port until `jobwatch dashboard start` is run on
    # the host; while it is off, Nginx answers the short page below. The dashboard signs in with Google by itself, so this location
    # does not go through the OAuth front. Keep it before `location /`.
    location /dashboard {
        limit_req zone=jw_dashboard burst=30 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:18933;     # JW_DASHBOARD_BIND:JW_DASHBOARD_HOST_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;      # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
        error_page 502 503 504 = @dashboard_off;
    }
    location @dashboard_off {
        default_type text/plain;
        return 503 "The dashboard is off. On the host, run: jobwatch dashboard start\n";
    }

    # Everything goes to the OAuth front, which serves /.well-known/*, /register, /authorize, /consent,
    # /callback, /token and proxies /mcp to the router once the bearer token is valid. Do not rewrite paths.
    location / {
        proxy_pass http://127.0.0.1:18931;     # JW_BIND:JW_HOST_PORT
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;      # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;                   # Streamable HTTP / SSE must not be buffered
        proxy_cache off;
        proxy_read_timeout 300s;               # longer than the slowest tool (catalog timeout_s) plus queue time
        proxy_send_timeout 300s;
    }

    # Optional: only let Anthropic's egress range reach the MCP path, keep discovery and OAuth open
    # (Anthropic warns that blocking the authorization server's discovery breaks the connector).
    # location = /mcp {
    #     allow 160.79.104.0/21;
    #     deny all;
    #     proxy_pass http://127.0.0.1:18931;  # repeat the proxy_* directives from above
    # }
}
