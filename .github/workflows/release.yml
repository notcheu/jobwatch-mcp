name: Release

# Releases are on demand. Running this workflow by hand (Actions, Release, Run workflow, or `gh workflow run release.yml`) opens or updates the
# release pull request: version bump and CHANGELOG.md from the conventional PR titles. Merging that pull request tags the release, creates the
# GitHub Release and, in the same run, publishes the router image. An ordinary merge to main does nothing: only the push of the release
# pull request's own commit (`chore(main): release X.Y.Z`) starts the job.
# (The image is built here and not from a `release: published` trigger: a release created with the default GITHUB_TOKEN does not start other workflows.)
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(main): release')
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A pull request opened with the default token does not run CI. Set RELEASE_PLEASE_TOKEN (a PAT or app token) to have it run.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_IMAGE: notcheu/jobwatch-mcp
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout the release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Missing Docker Hub credentials skip the publish instead of failing main (forks never have them).
      - name: Can we publish?
        id: gate
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not configured: the release is tagged but the image is not published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (arm64 emulation for the multi-arch build)
        if: steps.gate.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.gate.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: steps.gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        if: steps.gate.outputs.publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          # 0.1.0 -> 0.1.0, 0.1 and latest. The bare major (0) is not published: on 0.x it says nothing.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=jobwatch-mcp
            org.opencontainers.image.description=Self-hosted read-only MCP server for job-search sources

      - name: Build and push
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Plain image index only: a provenance attestation adds an "unknown/unknown" entry that Watchtower fails to resolve when it
          # checks for a new digest. Revisit if Watchtower is no longer a supported way to update.
          provenance: false
