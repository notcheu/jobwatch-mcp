name: PR title

# Squash merges use the pull request title as the commit message, and the release notes and the version bump are built from it.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            build
            perf
            wip
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: 'The summary must start with a lowercase letter, for example "feat(core): add a thing".'
