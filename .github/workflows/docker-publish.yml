name: Build and publish Docker image

on:
  push:
    branches: [main]
  pull_request:

env:
  NX_DAEMON: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # format check + lint (incl. architecture rules) + typecheck + unit/contract tests.
      # Integration tests need the browser runtime and run on the NUC only (see 11-testing-and-validation.md).
      - run: npm run ci

  build-and-push:
    needs: test
    # Publish only from main, never from a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The router app arrives in Phase 1, step 4. Until then there is nothing to build, so the steps below are skipped.
      # (hashFiles() is not allowed in a job-level condition, hence this explicit check.)
      - name: Is the router app present?
        id: app
        run: echo "present=$([ -f apps/mcp/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation for the multi-arch build)
        if: steps.app.outputs.present == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.app.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        if: steps.app.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        if: steps.app.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64 # amd64 = the Ubuntu NUC (x86_64, confirmed); arm64 = Apple Silicon Macs for development
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/jobwatch-router:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Plain single-platform-per-entry image only: a provenance attestation makes an OCI index with an
          # "unknown/unknown" entry that Watchtower fails to resolve when checking for a new digest. (The two-platform
          # manifest list is a normal image index; VERIFY Watchtower resolves it.)
          provenance: false
