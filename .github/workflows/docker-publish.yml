name: Build and publish Docker image

on:
  push:
    branches: [main]
  pull_request:

env:
  NX_DAEMON: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # format check + lint (incl. architecture rules) + typecheck + unit/contract tests.
      # Integration tests need the browser runtime and run on the reference host only (see docs/plans/11-testing-and-validation.md).
      # The whole suite must stay under 5 minutes (CLAUDE.md). A test that spins the CPU defeats vitest's own timeouts, so
      # this step cap is what turns a hang into a quick failure instead of a 12-minute stall.
      - run: npm run ci
        timeout-minutes: 5
      # The dashboard is a front end with many packages: fail on a known high or critical advisory in anything that ships
      # (docs/plans/17-dashboard.md, section 8), and make sure every app, the interface included, still builds.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        timeout-minutes: 5

  build-and-push:
    needs: test
    # Publish only from main, never from a pull request.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Publish only when there is something to build AND somewhere to push it. Secrets cannot be tested in an `if:` directly,
      # so they are passed to this step and checked in shell. Missing secrets skip the publish instead of failing `main`.
      - name: Can we publish? (router app present and registry secrets configured)
        id: gate
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ ! -f apps/mcp/package.json ]; then
            echo "::notice::apps/mcp not found: nothing to build"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$REGISTRY_URL" ] || [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::notice::Registry secrets (REGISTRY_URL, REGISTRY_USERNAME, REGISTRY_PASSWORD) are not configured: skipping the image publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (arm64 emulation for the multi-arch build)
        if: steps.gate.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.gate.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        if: steps.gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        if: steps.gate.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64 # amd64 = the reference Ubuntu host (x86_64, confirmed); arm64 = Apple Silicon Macs for development
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/jobwatch-router:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Plain single-platform-per-entry image only: a provenance attestation makes an OCI index with an
          # "unknown/unknown" entry that Watchtower fails to resolve when checking for a new digest. (The two-platform
          # manifest list is a normal image index; VERIFY Watchtower resolves it.)
          provenance: false
