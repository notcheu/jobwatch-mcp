name: Build and publish Docker image

on:
  push:
    branches: [main]

jobs:
  test:
    # Skipped until the router code exists (package.json committed).
    if: ${{ hashFiles('package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test          # unit + contract only; integration needs the browser runtime (see 11-…)
      - run: npm run catalog:gen && git diff --exit-code catalog/

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64        # confirmed: host is x86_64 (docs/measurements.md)
          push: true
          tags: ${{ secrets.REGISTRY_URL }}/jobwatch-router:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Plain single-platform image only: a provenance attestation makes an OCI index with an
          # "unknown/unknown" entry that Watchtower fails to resolve when checking for a new digest.
          provenance: false
