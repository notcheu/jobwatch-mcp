# Phase 0 spike S1: the real OAuth front (babs/mcp-auth-proxy) + Redis in front of the echo MCP server.
# Prerequisites: DNS + Nginx for mcp.noguetith.fr and the Google OAuth app (10-deployment.md); values in deploy/.env.
#   docker compose -f spikes/s1/compose.s1.yml --env-file deploy/.env up -d --build
# Stop it before bringing up deploy/compose.yml: both publish the same port.
name: jobwatch-s1
services:
  front:
    image: ${JW_FRONT_IMAGE:-ghcr.io/babs/mcp-auth-proxy:1.4.1}
    environment:
      PROXY_BASE_URL: ${JW_BASE_URL}
      UPSTREAM_MCP_URL: http://echo:8080/mcp
      OIDC_ISSUER_URL: https://accounts.google.com
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      TOKEN_SIGNING_SECRET: ${TOKEN_SIGNING_SECRET}
      REDIS_URL: redis://redis:6379/0
      TRUSTED_PROXY_CIDRS: ${JW_NGINX_CIDR}
    depends_on:
      redis: { condition: service_healthy }
      echo: { condition: service_started }
    ports:
      - "${JW_BIND:-127.0.0.1}:${JW_HOST_PORT:-18931}:8080"
    mem_limit: 128m
    read_only: true
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    restart: unless-stopped
  redis:
    image: ${JW_REDIS_IMAGE:-redis:7-alpine}
    user: "999:999"                          # the image's own redis user (root entrypoint needs capabilities that cap_drop ALL removes)
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction" ]
    volumes: [ "redis-data:/data" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 64m
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    restart: unless-stopped
  echo:
    build: ../echo-mcp
    mem_limit: 128m
    read_only: true
    tmpfs: [ "/tmp:rw,size=32m,uid=1000,gid=1000" ]   # tsx writes its compile cache to /tmp
    cap_drop: [ ALL ]
    security_opt: [ "no-new-privileges:true" ]
    restart: unless-stopped
volumes:
  redis-data:
